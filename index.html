<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CRICKET LEGENDS 3D — CAREER MODE (Dev)</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="loading" class="overlay">Loading... <button id="loading-failsafe" hidden>Continue</button></div>

  <header class="topbar">
    <div class="logo">CRICKET LEGENDS 3D <small style="font-weight:400;margin-left:8px;opacity:.6">CAREER MODE</small></div>
    <div class="top-stats">
      <span id="player-xp">XP: 0</span>
      <span id="player-money">Coins: 0</span>
      <button id="btn-settings">⚙️</button>
    </div>
  </header>

  <main id="app">
    <nav class="bottom-nav">
      <button data-route="home" class="active">Home</button>
      <button data-route="career">Career</button>
      <button data-route="match">Match</button>
      <button data-route="customize">Customize</button>
      <button data-route="club">Club</button>
    </nav>

    <section id="screen-home" class="screen active">
      <div class="cinematic">
        <div id="three-container" class="threebox"></div>
        <div class="panels">
          <div class="player-card">
            <h2 id="player-name">Player</h2>
            <div id="player-meta">Country • Role • Overall</div>
            <div id="player-stats" class="stat-grid"></div>
            <div style="margin-top:12px;display:flex;gap:8px">
              <button id="btn-continue" class="primary">CONTINUE CAREER</button>
              <button id="btn-preview">Match Preview</button>
            </div>
          </div>

          <div class="next-match-card">
            <h3>Next Match</h3>
            <div id="next-match">No scheduled match</div>
            <div style="margin-top:8px" id="match-countdown"></div>
          </div>

          <div class="card" id="career-news">
            <h4>Career News</h4>
            <ul id="news-list" style="margin:6px 0 0 16px;padding:0;list-style:disc;color:var(--muted)">
              <li>No news</li>
            </ul>
          </div>

          <div class="card" id="recent-performance">
            <h4>Recent Performance</h4>
            <div id="recent-list" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          </div>

        </div>
      </div>
    </section>

    <section id="screen-career" class="screen">
      <h2>My Career</h2>
      <div id="career-content"></div>
    </section>

    <section id="screen-match" class="screen">
      <h2>Match</h2>
      <div id="match-area"></div>
    </section>

    <section id="screen-customize" class="screen">
      <h2>Customize</h2>
      <div id="customize-area"></div>
    </section>

    <section id="screen-club" class="screen">
      <h2>Club</h2>
      <div id="club-area"></div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
